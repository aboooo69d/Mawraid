basePath: /api/v1
definitions:
  dto.ConsumerResponse:
    properties:
      business_file:
        type: string
      business_name:
        type: string
      created_at:
        type: string
      family_count:
        type: integer
      id:
        type: string
      id_image:
        type: string
      id_number:
        type: string
      is_business:
        type: boolean
      is_driver:
        type: boolean
      is_home:
        type: boolean
      is_verified:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role_id:
        type: integer
      role_name:
        type: string
      status:
        type: string
      updated_at:
        type: string
      vehicle_number:
        type: string
      vehicle_type:
        type: string
    type: object
  dto.CreateProviderRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      end_at:
        type: string
      name:
        maxLength: 50
        minLength: 10
        type: string
      password:
        maxLength: 255
        minLength: 8
        type: string
      phone:
        type: string
      start_at:
        type: string
    required:
    - end_at
    - name
    - password
    - phone
    - start_at
    type: object
  dto.CreateStockRequest:
    properties:
      stock_type_id:
        type: integer
      units:
        items:
          $ref: '#/definitions/dto.CreateUnitRequest'
        minItems: 1
        type: array
    required:
    - stock_type_id
    - units
    type: object
  dto.CreateTransactionRequest:
    properties:
      amount:
        type: integer
      description:
        maxLength: 1000
        type: string
      is_in:
        description: pointer so `false` passes "required"
        type: boolean
      unit_id:
        type: integer
    required:
    - amount
    - is_in
    - unit_id
    type: object
  dto.CreateUnitRequest:
    properties:
      is_main:
        type: boolean
      name:
        maxLength: 50
        type: string
      rate:
        minimum: 1
        type: integer
    required:
    - name
    - rate
    type: object
  dto.ForgetPasswordRequest:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  dto.ProviderResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      end_at:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role_id:
        type: integer
      role_name:
        type: string
      start_at:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.RestPasswordRequest:
    properties:
      password:
        type: string
      rest_key:
        type: string
    required:
    - password
    - rest_key
    type: object
  dto.StockResponse:
    properties:
      available:
        description: in the main unit
        type: number
      balances:
        description: available in every unit
        items:
          $ref: '#/definitions/dto.UnitBalance'
        type: array
      created_at:
        type: string
      id:
        type: string
      type:
        $ref: '#/definitions/dto.StockTypeResponse'
      units:
        items:
          $ref: '#/definitions/dto.UnitResponse'
        type: array
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.StockTypeResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.TransactionResponse:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_in:
        type: boolean
      stock_id:
        type: string
      unit:
        $ref: '#/definitions/dto.UnitResponse'
      user_id:
        type: string
    type: object
  dto.UnitBalance:
    properties:
      amount:
        type: number
      unit:
        type: string
      unit_id:
        type: integer
    type: object
  dto.UnitResponse:
    properties:
      id:
        type: integer
      is_main:
        type: boolean
      name:
        type: string
      rate:
        type: integer
    type: object
  dto.UpdateUnitRequest:
    properties:
      name:
        maxLength: 50
        minLength: 1
        type: string
      rate:
        minimum: 1
        type: integer
    type: object
  dto.UserLoginRequest:
    properties:
      password:
        maxLength: 255
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  dto.UserResponseBase:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      phone:
        type: string
      role_id:
        type: integer
      role_name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.VerifyPhoneRequest:
    properties:
      code:
        type: string
      phone:
        type: string
    required:
    - code
    - phone
    type: object
  respons.AppError:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  respons.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  respons.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/respons.AppError'
      meta:
        $ref: '#/definitions/respons.Meta'
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@nova.local
    name: Nova API Support
  description: Backend REST API for Nova platform with Go, Gin, PostgreSQL, and Redis.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Nova API
  version: "1.0"
paths:
  /auth/forget-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset key via SMS to the given phone number (if
        it exists).
      parameters:
      - description: Phone number
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reset key sent (if account exists)
          schema:
            $ref: '#/definitions/respons.Response'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Request password reset
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with phone and password.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged in successfully
          schema:
            allOf:
            - $ref: '#/definitions/respons.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponseBase'
              type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/respons.Response'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/respons.Response'
        "403":
          description: Account not verified or not active
          schema:
            $ref: '#/definitions/respons.Response'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: logout and and delete cookies.
      produces:
      - application/json
      responses:
        "200":
          description: Logged in successfully
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Invalid request body
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Logout user
      tags:
      - Auth
  /auth/register/consumer:
    post:
      consumes:
      - multipart/form-data
      description: Register a new consumer profile with encrypted id_image and optional
        business_file uploads.
      parameters:
      - description: Phone number (min 9, max 20)
        in: formData
        name: phone
        required: true
        type: string
      - description: Password (min 8, max 255)
        in: formData
        name: password
        required: true
        type: string
      - description: Consumer full name
        in: formData
        name: name
        required: true
        type: string
      - description: National ID or civil number
        in: formData
        name: id_number
        required: true
        type: string
      - description: ID card photo (jpeg/png/webp, max 5MB)
        in: formData
        name: id_image
        required: true
        type: file
      - description: Is consumer a driver
        in: formData
        name: is_driver
        type: boolean
      - description: Vehicle plate number (required if is_driver is true)
        in: formData
        name: vehicle_number
        type: string
      - description: Vehicle type (required if is_driver is true)
        in: formData
        name: vehicle_type
        type: string
      - description: Is consumer a home/family head
        in: formData
        name: is_home
        type: boolean
      - description: Family count (>= 1, required if is_home is true)
        in: formData
        name: family_count
        type: integer
      - description: Is consumer a business
        in: formData
        name: is_business
        type: boolean
      - description: Business name (required if is_business is true)
        in: formData
        name: business_name
        type: string
      - description: Commercial registry or license file (required if is_business
          is true)
        in: formData
        name: business_file
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Registered successfully
          schema:
            allOf:
            - $ref: '#/definitions/respons.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ConsumerResponse'
              type: object
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/respons.Response'
        "409":
          description: Phone number already registered
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Register a new consumer
      tags:
      - Auth
  /auth/register/provider:
    post:
      consumes:
      - application/json
      description: Register a new service provider profile.
      parameters:
      - description: Provider registration request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Registered successfully
          schema:
            allOf:
            - $ref: '#/definitions/respons.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProviderResponse'
              type: object
        "400":
          description: Invalid request or missing profile data
          schema:
            $ref: '#/definitions/respons.Response'
        "409":
          description: Phone number already registered
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Register a new provider
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets the user's password using the reset key received via SMS.
      parameters:
      - description: Reset key and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RestPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            $ref: '#/definitions/respons.Response'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/respons.Response'
        "403":
          description: Invalid or expired reset key
          schema:
            $ref: '#/definitions/respons.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Reset password
      tags:
      - Auth
  /auth/verify-phone:
    post:
      consumes:
      - application/json
      description: Verifies the phone number using the 6-digit OTP code sent after
        registration.
      parameters:
      - description: Phone and 6-digit OTP code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyPhoneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Phone verified successfully
          schema:
            $ref: '#/definitions/respons.Response'
        "400":
          description: Invalid request or invalid OTP code
          schema:
            $ref: '#/definitions/respons.Response'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/respons.Response'
        "409":
          description: Account is already verified
          schema:
            $ref: '#/definitions/respons.Response'
        "429":
          description: Rate limit exceeded (cooldown / max attempts)
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Verify phone with OTP
      tags:
      - Auth
  /stocks:
    get:
      description: Returns a paginated list of stocks owned by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: Stocks retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/respons.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.StockResponse'
                  type: array
              type: object
        "400":
          description: Invalid pagination parameters
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: List user stocks
      tags:
      - Stock
    post:
      consumes:
      - application/json
      description: Create a stock for the authenticated user together with its units
        (exactly one main unit with rate = 1). Each user can only have one stock.
      parameters:
      - description: Stock creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Stock created successfully
          schema:
            allOf:
            - $ref: '#/definitions/respons.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.StockResponse'
              type: object
        "400":
          description: Invalid request or unit validation error
          schema:
            $ref: '#/definitions/respons.Response'
        "404":
          description: Stock type not found
          schema:
            $ref: '#/definitions/respons.Response'
        "409":
          description: Duplicate unit name or user already has a stock
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Create a new stock
      tags:
      - Stock
  /stocks/{stock_id}:
    get:
      description: Returns a stock's info, units, and available balance in every unit.
      parameters:
      - description: Stock ID (UUID)
        in: path
        name: stock_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Stock retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/respons.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.StockResponse'
              type: object
        "404":
          description: Stock not found
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Get stock details
      tags:
      - Stock
  /stocks/{stock_id}/transactions:
    get:
      description: Returns the paginated transaction history (newest first) for a
        stock.
      parameters:
      - description: Stock ID (UUID)
        in: path
        name: stock_id
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: page_size
        type: integer
      - description: Filter by direction (true = in, false = out)
        in: query
        name: is_in
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Transactions retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/respons.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.TransactionResponse'
                  type: array
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/respons.Response'
        "404":
          description: Stock not found
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: List stock transactions
      tags:
      - Stock
    post:
      consumes:
      - application/json
      description: Adds to (is_in = true) or withdraws from (is_in = false) the stock
        using one of its units.
      parameters:
      - description: Stock ID (UUID)
        in: path
        name: stock_id
        required: true
        type: string
      - description: Transaction payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Transaction created successfully
          schema:
            allOf:
            - $ref: '#/definitions/respons.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.TransactionResponse'
              type: object
        "400":
          description: Invalid request, invalid amount, or unit not in stock
          schema:
            $ref: '#/definitions/respons.Response'
        "404":
          description: Stock not found
          schema:
            $ref: '#/definitions/respons.Response'
        "409":
          description: Insufficient stock
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Create stock transaction
      tags:
      - Stock
  /stocks/{stock_id}/units:
    post:
      consumes:
      - application/json
      description: Adds an extra (non-main) unit to an existing stock owned by the
        authenticated user.
      parameters:
      - description: Stock ID (UUID)
        in: path
        name: stock_id
        required: true
        type: string
      - description: Unit creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUnitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Unit added successfully
          schema:
            allOf:
            - $ref: '#/definitions/respons.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UnitResponse'
              type: object
        "400":
          description: Invalid request or main unit already exists
          schema:
            $ref: '#/definitions/respons.Response'
        "404":
          description: Stock not found
          schema:
            $ref: '#/definitions/respons.Response'
        "409":
          description: Duplicate unit name
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Add unit to stock
      tags:
      - Stock
  /stocks/{stock_id}/units/{unit_id}:
    patch:
      consumes:
      - application/json
      description: Updates the name and/or rate of an existing unit in a stock.
      parameters:
      - description: Stock ID (UUID)
        in: path
        name: stock_id
        required: true
        type: string
      - description: Unit ID
        in: path
        name: unit_id
        required: true
        type: integer
      - description: Unit update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUnitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Unit updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/respons.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UnitResponse'
              type: object
        "400":
          description: Invalid request or invalid main unit rate
          schema:
            $ref: '#/definitions/respons.Response'
        "404":
          description: Stock or unit not found
          schema:
            $ref: '#/definitions/respons.Response'
        "409":
          description: Duplicate unit name or unit has transactions
          schema:
            $ref: '#/definitions/respons.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respons.Response'
      summary: Update stock unit
      tags:
      - Stock
swagger: "2.0"
